site_name: Joshua Oh
site_description: >-
  Electronic & Electrical Engineering portfolio of Joshua Oh (Oh Yu Qiao) —
  embedded systems, computer vision and IoT projects built end to end.
site_author: Joshua Oh (Oh Yu Qiao)
site_url: https://joshuaohyq.github.io/Portfolio/

repo_url: https://github.com/JoshuaOhYQ/Portfolio
repo_name: JoshuaOhYQ/Portfolio
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Oh Yu Qiao

theme:
  name: material
  language: en
  logo: assets/img/site/logo.svg
  favicon: assets/img/site/favicon.png
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Projects:
      - Overview: projects/index.md
      - Smart Waste Segregation: projects/smart-waste-segregation.md
      - PIPER — Dementia Assistive Robot: projects/piper.md
      - Solar Irrigation Control: projects/solar-irrigation.md
  - About: about.md
  - Contact: contact.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/JoshuaOhYQ
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/oh-yu-qiao-425053317/
      name: LinkedIn
    - icon: fontawesome/solid/envelope
      link: mailto:yuqiao.oh@gmail.com
      name: Email
  generator: false
